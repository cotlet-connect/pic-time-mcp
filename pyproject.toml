[project]
name = "pic-time-mcp"
version = "1.1.0"
description = "Connect Pic-Time to Claude Code, ChatGPT and any AI agent through Cotlet.dev, a hosted MCP server. No Pic-Time API key needed."
readme = "README.md"
license = "Elastic-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Cotlet.dev", email = "contact@cotlet.dev" }]
keywords = ["pic-time", "pic-time api", "pic-time mcp", "mcp server", "claude", "chatgpt", "ai agent", "cotlet"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Office/Business"]
dependencies = []

[project.urls]
Homepage = "https://cotlet.dev/integrations/pic-time-api-mcp-server?utm_source=pypi&utm_medium=package&utm_campaign=pic-time"
Source = "https://github.com/cotlet-connect/pic-time-mcp"

[project.scripts]
pic-time-mcp = "pic_time_agent:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"pic_time_agent.py" = "pic_time_agent.py"

[tool.hatch.build.targets.sdist]
include = ["pic_time_agent.py", "README.md", "LICENSE", "mcp.json", "Dockerfile", "glama.json", "skills", "examples", ".cursor"]
